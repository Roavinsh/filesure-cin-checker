
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileSure | CIN & LLPIN Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">FileSure<span>.</span></div>
    <div class="nav-label">COMPANY INTELLIGENCE</div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="eyebrow">INDIA CORPORATE IDENTIFIER TOOL</div>
      <h1>Know your company.<br><span>Decode its identity.</span></h1>
      <p>Understand CIN and LLPIN identifiers with a simple, accurate format checker.</p>
    </section>

    <section class="checker">
      <label for="identifiers">Enter CIN / LLPIN numbers</label>
      <textarea id="identifiers" placeholder="L17110MH1973PLC019786&#10;AAA-1234"></textarea>
      <div class="helper">Enter one identifier per line.</div>
      <button id="checkBtn">Check identifiers →</button>
      <div id="results"></div>
    </section>
    <footer>Built for clarity. Designed for confidence.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
